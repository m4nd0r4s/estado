name: Site

on:
  push:
    branches: [main]
    paths: [site/**, docs/**, crates/estado-macros/tests/ui/**, README.md, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, docs/**, crates/estado-macros/tests/ui/**, README.md, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

# Superseded builds are cancelled; a deploy in progress never is (see the deploy job).
concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
        env:
          BASE_PATH: /estado
      - uses: actions/upload-pages-artifact@v4
        with: { path: site/build }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
