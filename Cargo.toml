[workspace]
resolver = "3"
members = ["crates/*", "checks/*", "examples"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diogoleite/estado"

[workspace.dependencies]
estado-core = { path = "crates/estado-core", version = "0.0.0", default-features = false }
estado-macros = { path = "crates/estado-macros", version = "0.0.0" }
estado-graph = { path = "crates/estado-graph", version = "0.0.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.bench]
debug = true
