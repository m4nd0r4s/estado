[package]
name = "estado-core"
description = "Sans-IO core of estado hierarchical statecharts: Spec, Machine and the step algorithm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []
tracing = []
inspect = []
invariants = []
serde = []

[dev-dependencies]
# Dev-only: never part of the library build, so no_std builds are unaffected.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "bm_02_ping_pong"
harness = false
