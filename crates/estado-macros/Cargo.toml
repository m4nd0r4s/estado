[package]
name = "estado-macros"
description = "Procedural macros for estado: #[machine], #[state], #[handlers], goto!"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }

[dev-dependencies]
estado-core.workspace = true
trybuild = "1"
