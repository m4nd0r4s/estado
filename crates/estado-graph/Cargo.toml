[package]
name = "estado-graph"
description = "Graph export (mermaid, DOT, SCXML, JSON) and analyses for estado machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
estado-core.workspace = true

[features]
default = ["std"]
# Enables `assert_snapshot!` and the snapshot helpers, which read and write files.
std = []

[dev-dependencies]
serde_json = "1"
